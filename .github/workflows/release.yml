name: Release

on:
  push:
    branches: [master]
    paths: [build.gradle.kts]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' build.gradle.kts | head -n1)
          [ -z "$VERSION" ] && { echo "::error::No version in build.gradle.kts"; exit 1; }
          [[ "$VERSION" == *SNAPSHOT* ]] && { echo "$VERSION is a snapshot, skipping"; exit 0; }
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > /dev/null 2>&1 \
            && { echo "v$VERSION already released, skipping"; exit 0; }
          chmod +x gradlew
          ./gradlew build distZip
          gh release create "v$VERSION" build/distributions/*.zip \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes